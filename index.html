<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101714"><title>貪食蛇・小小森林</title>
<style>
:root{color-scheme:dark;--bg:#101714;--panel:#19231d;--line:#2a382f;--lime:#b8f36b;--muted:#94a397;--cream:#f3f4e8}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#23352a 0,transparent 55%),var(--bg);color:var(--cream);font:16px/1.5 ui-rounded,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:var(--lime);color:#172014;display:grid;place-items:center;font-size:24px;box-shadow:0 7px 22px #b8f36b35}h1{font-size:20px;margin:0;letter-spacing:.04em}.tagline{font-size:12px;color:var(--muted)}.scores{display:flex;gap:10px}.score{background:#19231d;border:1px solid var(--line);border-radius:13px;padding:7px 13px;text-align:center;min-width:75px}.score small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em}.score strong{font-variant-numeric:tabular-nums;font-size:20px;color:var(--lime)}.game{background:linear-gradient(145deg,#1b2820,#151d18);border:1px solid #34483a;border-radius:24px;padding:14px;box-shadow:0 24px 75px #0006;position:relative}.board-wrap{position:relative;overflow:hidden;border-radius:15px;background:#111a14;aspect-ratio:1}.board{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0d140ecc;backdrop-filter:blur(3px);text-align:center;padding:24px}.overlay.hidden{display:none}.card h2{font-size:25px;margin:0 0 5px}.card p{margin:0 0 18px;color:#b4c0b6;font-size:14px}.btn{border:0;border-radius:12px;background:var(--lime);color:#182014;font:700 15px inherit;padding:12px 22px;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:scale(.97)}.bar{display:flex;justify-content:space-between;align-items:center;padding:13px 3px 2px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#67766b;border-radius:50%}.dot.live{background:var(--lime);box-shadow:0 0 10px var(--lime)}.bar kbd{font:inherit;color:#dce5dc;background:#26332a;border:1px solid #39483c;border-radius:5px;padding:2px 6px}.controls{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:7px;justify-content:center;margin:15px auto 2px;user-select:none}.pad{border:1px solid #34483a;background:#202d24;color:#eaf2e7;border-radius:12px;font-size:20px;cursor:pointer;touch-action:manipulation}.pad:active{background:#344735}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.hint{text-align:center;color:#718076;font-size:11px;margin:14px 0 0}@media(min-width:600px){.controls{display:none}.hint{margin-top:12px}}@media(max-width:420px){body{padding:15px}.game{padding:10px;border-radius:19px}.score{min-width:65px;padding:6px 9px}}
</style></head>
<body><main class="shell"><header><div class="brand"><div class="mark">✳</div><div><h1>貪食蛇・小小森林</h1><div class="tagline">吃下果實，慢慢長大。</div></div></div><div class="scores"><div class="score"><small>得分</small><strong id="score">00</strong></div><div class="score"><small>最高紀錄</small><strong id="best">00</strong></div></div></header>
<section class="game"><div class="board-wrap"><canvas class="board" id="board" aria-label="貪食蛇遊戲區"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">準備好出發了嗎？</h2><p id="message">收集果實，別撞到牆或自己。</p><button class="btn" id="start">開始遊戲</button></div></div></div><div class="bar"><span class="status"><i class="dot" id="dot"></i><span id="status">等待開始</span></span><span><kbd>方向鍵</kbd> 或 <kbd>WASD</kbd></span></div><div class="controls" aria-label="方向控制"><button class="pad up" data-dir="up">↑</button><button class="pad left" data-dir="left">←</button><button class="pad down" data-dir="down">↓</button><button class="pad right" data-dir="right">→</button></div></section><p class="hint">按空白鍵暫停・在手機上使用方向按鈕</p></main>
<script>
(()=>{const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),statusEl=document.querySelector('#status'),dot=document.querySelector('#dot'),title=document.querySelector('#title'),message=document.querySelector('#message'),startBtn=document.querySelector('#start');const N=20;let snake,food,dir,nextDir,timer,state='ready',score=0,best=Number(localStorage.getItem('forestSnakeBest')||0);bestEl.textContent=String(best).padStart(2,'0');
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}new ResizeObserver(resize).observe(canvas);
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,cell=w/N;ctx.clearRect(0,0,w,h);ctx.fillStyle='#111a14';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#1b281e';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,h);ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke()}if(!snake)return;ctx.fillStyle='#ffcf72';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b8f36b';snake.forEach((p,i)=>{const x=p.x*cell+cell*.11,y=p.y*cell+cell*.11;ctx.beginPath();ctx.roundRect(x,y,cell*.78,cell*.78,i===0?cell*.28:cell*.2);ctx.fill();if(i===0){ctx.fillStyle='#23301d';const ex=dir.x===1?x+cell*.59:dir.x===-1?x+cell*.19:x+cell*.3,ey=dir.y===1?y+cell*.59:dir.y===-1?y+cell*.19:y+cell*.3;ctx.beginPath();ctx.arc(ex,ey,cell*.055,0,7);ctx.arc(ex+(dir.y?cell*.25:0),ey+(dir.x?cell*.25:0),cell*.055,0,7);ctx.fill();ctx.fillStyle='#b8f36b'}})}
function placeFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function begin(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir=dir;score=0;food=placeFood();scoreEl.textContent='00';state='playing';overlay.classList.add('hidden');statusEl.textContent='森林探險中';dot.classList.add('live');draw();timer=setInterval(tick,145)}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(p=>p.x===head.x&&p.y===head.y)){finish();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=String(score).padStart(2,'0');if(score>best){best=score;bestEl.textContent=String(best).padStart(2,'0');localStorage.setItem('forestSnakeBest',best)}food=placeFood();if(score%5===0){clearInterval(timer);timer=setInterval(tick,Math.max(75,145-score*3))}}else snake.pop();draw()}
function finish(){clearInterval(timer);state='over';statusEl.textContent='本回合結束';dot.classList.remove('live');title.textContent='森林探險結束';message.textContent='這次收集了 '+score+' 顆果實，再來一回合吧！';startBtn.textContent='再玩一次';overlay.classList.remove('hidden')}
function pause(){if(state==='playing'){clearInterval(timer);state='paused';statusEl.textContent='暫停中';dot.classList.remove('live');title.textContent='休息一下';message.textContent='目前得分 '+score+'，準備好再繼續。';startBtn.textContent='繼續遊戲';overlay.classList.remove('hidden')}else if(state==='paused'){state='playing';overlay.classList.add('hidden');statusEl.textContent='森林探險中';dot.classList.add('live');timer=setInterval(tick,Math.max(75,145-score*3))}}
const vectors={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};function turn(d){const v=vectors[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))nextDir=v}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();turn(map[k])}if(e.code==='Space'){e.preventDefault();if(state==='playing'||state==='paused')pause();else if(state==='ready'||state==='over')begin()}});document.querySelectorAll('.pad').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)})});startBtn.addEventListener('click',()=>state==='paused'?pause():begin());resize()})();
</script></body></html>
